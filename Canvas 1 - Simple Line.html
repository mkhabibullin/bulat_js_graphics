<html>
    <head>
        <title>Simple Line - Canvas</title>
    </head>
    <body>
        <canvas id="canvas" width="800" height="800"></canvas>

        <script>
            const canvas = document.getElementById('canvas');
            const ctx = canvas.getContext('2d');
            const center = [canvas.width / 2, canvas.height / 2];

            const angle = 15;
            const radians = angle * Math.PI / 100;
            const shiftX = 20;

            let startPoint = [center[0], center[1] - 100];
            let endPoint = [center[0] + 100, center[1] + 100];

            const rotateMatrix = [
                [Math.cos(radians), -Math.sin(radians), 0],
                [Math.sin(radians), Math.cos(radians), 0],
            ];

            const shiftMatrix = [
                [1, 0, shiftX],
                [0, 1,  0],
                [0, 0,  1]
            ];

            canvas.addEventListener('click', function(event) {
                action();
            });

            function action() {
                clearCanvas();

                startPoint = transformPoint(startPoint, rotateMatrix);
                endPoint = transformPoint(endPoint, rotateMatrix);

                startPoint = shiftPoint(startPoint, shiftMatrix);
                endPoint = shiftPoint(endPoint, shiftMatrix);

                drawLine(
                    startPoint[0],
                    startPoint[1],
                    endPoint[0],
                    endPoint[1]);
            }

            function clearCanvas() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
            }

            function drawLine(x1, y1, x2, y2) {
                ctx.beginPath();
                ctx.moveTo(x1, y1);
                ctx.lineTo(x2, y2);
                ctx.stroke();
            }

            function transformPoint(point, matrix) {
                let [x, y] = point;

                x -= center[0];
                y -= center[1];

                const newX = x * matrix[0][0] + y * matrix[0][1];
                const newY = x * matrix[1][0] + y * matrix[1][1];

                return [newX + center[0], newY + center[1]];
            }

            function shiftPoint(point, matrix) {
                const [x, y] = point;

                const newX = x * matrix[0][0] +
                            y * matrix[0][1] +
                                matrix[0][2];

                const newY = x * matrix[1][0] +
                            y * matrix[1][1] +
                                matrix[1][2];

                return [newX, newY];
            }

            clearCanvas();

            drawLine(startPoint[0], startPoint[1], endPoint[0], endPoint[1]);

            setInterval(action, 100);

        </script>
    </body>
</html>
