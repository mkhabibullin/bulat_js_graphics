<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<title>3D Spaceship</title>

<style>
body {
    font-family: Arial, sans-serif;
    text-align: center;
}

canvas {
    border: 1px solid black;
    background: #f4f4f4;
}

.controls {
    width: 650px;
    margin: 15px auto;
    text-align: left;
}

.control {
    margin: 10px 0;
}

input[type="range"] {
    width: 350px;
}
</style>
</head>

<body>

<h2>3D Geometry — Spaceship</h2>

<canvas
    id="canvas"
    width="900"
    height="600">
</canvas>


<div class="controls">

    <div class="control">
        Rotate Y:
        <input
            id="rotationY"
            type="range"
            min="0"
            max="360"
            value="25"
        >
        <span id="rotationYValue"></span>
    </div>


    <div class="control">
        Rotate X:
        <input
            id="rotationX"
            type="range"
            min="-90"
            max="90"
            value="-10"
        >
        <span id="rotationXValue"></span>
    </div>


    <div class="control">
        Camera Z:
        <input
            id="cameraZ"
            type="range"
            min="-15"
            max="12"
            value="0"
            step="0.1"
        >
        <span id="cameraZValue"></span>
    </div>


    <div class="control">
        Perspective f:
        <input
            id="focal"
            type="range"
            min="150"
            max="900"
            value="450"
        >
        <span id="focalValue"></span>
    </div>

</div>


<script>

const canvas =
    document.getElementById("canvas");

const ctx =
    canvas.getContext("2d");


// =====================================================
// SPACESHIP VERTICES
//
// Each point:
//
// [x, y, z]
//
// x = left / right
// y = up / down
// z = front / back
//
// =====================================================

const vertices = [

    // --------------------------------------------
    // NOSE
    // --------------------------------------------

    [ 0,  0, -6],      // 0 nose tip


    // --------------------------------------------
    // FRONT BODY
    // --------------------------------------------

    [-1.2, -0.8, -3],  // 1
    [ 1.2, -0.8, -3],  // 2
    [ 1.2,  0.8, -3],  // 3
    [-1.2,  0.8, -3],  // 4


    // --------------------------------------------
    // MIDDLE BODY
    // --------------------------------------------

    [-1.5, -1, 1],     // 5
    [ 1.5, -1, 1],     // 6
    [ 1.5,  1, 1],     // 7
    [-1.5,  1, 1],     // 8


    // --------------------------------------------
    // REAR BODY
    // --------------------------------------------

    [-1.2, -0.8, 4],   // 9
    [ 1.2, -0.8, 4],   // 10
    [ 1.2,  0.8, 4],   // 11
    [-1.2,  0.8, 4],   // 12


    // --------------------------------------------
    // LEFT WING
    // --------------------------------------------

    [-1.5, 0, 0],      // 13
    [-6,   0, 3],      // 14
    [-5,   0, 5],      // 15
    [-1.2, 0, 3.5],    // 16


    // --------------------------------------------
    // RIGHT WING
    // --------------------------------------------

    [1.5, 0, 0],       // 17
    [6,   0, 3],       // 18
    [5,   0, 5],       // 19
    [1.2, 0, 3.5],     // 20


    // --------------------------------------------
    // VERTICAL TAIL
    // --------------------------------------------

    [0, 0.8, 2.5],     // 21
    [0, 4,   4],       // 22
    [0, 0.8, 4.5],     // 23


    // --------------------------------------------
    // COCKPIT
    // --------------------------------------------

    [-0.8, 0.8, -1.5], // 24
    [ 0.8, 0.8, -1.5], // 25

    [-0.6, 1.8, 0],    // 26
    [ 0.6, 1.8, 0],    // 27

    [-0.8, 0.8, 1.2],  // 28
    [ 0.8, 0.8, 1.2]   // 29
];



// =====================================================
// EDGES
//
// [vertexA, vertexB]
//
// =====================================================

const edges = [

    // nose -> front body

    [0,1],
    [0,2],
    [0,3],
    [0,4],


    // front rectangle

    [1,2],
    [2,3],
    [3,4],
    [4,1],


    // front -> middle

    [1,5],
    [2,6],
    [3,7],
    [4,8],


    // middle

    [5,6],
    [6,7],
    [7,8],
    [8,5],


    // middle -> rear

    [5,9],
    [6,10],
    [7,11],
    [8,12],


    // rear

    [9,10],
    [10,11],
    [11,12],
    [12,9],


    // left wing

    [13,14],
    [14,15],
    [15,16],
    [16,13],


    // connect left wing to body

    [13,5],
    [16,9],


    // right wing

    [17,18],
    [18,19],
    [19,20],
    [20,17],


    // connect right wing

    [17,6],
    [20,10],


    // tail

    [21,22],
    [22,23],
    [23,21],


    // cockpit

    [24,25],
    [25,27],
    [27,26],
    [26,24],

    [26,28],
    [27,29],

    [28,29],

    [24,28],
    [25,29]
];



// =====================================================
// ROTATION Y
// =====================================================

function rotateY(point, angle) {

    const [x, y, z] = point;

    const cos =
        Math.cos(angle);

    const sin =
        Math.sin(angle);


    return [

        x * cos - z * sin,

        y,

        x * sin + z * cos

    ];
}



// =====================================================
// ROTATION X
// =====================================================

function rotateX(point, angle) {

    const [x, y, z] = point;

    const cos =
        Math.cos(angle);

    const sin =
        Math.sin(angle);


    return [

        x,

        y * cos - z * sin,

        y * sin + z * cos

    ];
}



// =====================================================
// WORLD POSITION
// =====================================================

function moveToWorld(point) {

    const objectZ = 18;

    return [

        point[0],

        point[1],

        point[2] + objectZ

    ];
}



// =====================================================
// WORLD -> CAMERA
// =====================================================

function worldToCamera(
    point,
    cameraZ
) {

    return [

        point[0],

        point[1],

        point[2] - cameraZ

    ];
}



// =====================================================
// PERSPECTIVE
//
// screenX = f * x / z
// screenY = f * y / z
//
// =====================================================

function project(
    point,
    focalLength
) {

    const [x, y, z] = point;


    if (z <= 0.1) {
        return null;
    }


    return [

        canvas.width / 2
        +
        focalLength * x / z,


        canvas.height / 2
        -
        focalLength * y / z

    ];
}



// =====================================================
// UI
// =====================================================

const rotationYSlider =
    document.getElementById("rotationY");

const rotationXSlider =
    document.getElementById("rotationX");

const cameraZSlider =
    document.getElementById("cameraZ");

const focalSlider =
    document.getElementById("focal");



// =====================================================
// DRAW
// =====================================================

function draw() {

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    const rotationYDegrees =
        Number(rotationYSlider.value);

    const rotationXDegrees =
        Number(rotationXSlider.value);


    const angleY =
        rotationYDegrees
        *
        Math.PI
        /
        180;


    const angleX =
        rotationXDegrees
        *
        Math.PI
        /
        180;


    const cameraZ =
        Number(cameraZSlider.value);


    const focalLength =
        Number(focalSlider.value);



    // ---------------------------------------------
    // update labels
    // ---------------------------------------------

    document
        .getElementById("rotationYValue")
        .textContent =
        rotationYDegrees + "°";


    document
        .getElementById("rotationXValue")
        .textContent =
        rotationXDegrees + "°";


    document
        .getElementById("cameraZValue")
        .textContent =
        cameraZ.toFixed(1);


    document
        .getElementById("focalValue")
        .textContent =
        focalLength;



    // ---------------------------------------------
    // TRANSFORM ALL POINTS
    // ---------------------------------------------

    const transformedVertices =

        vertices.map(point => {

            let p =
                rotateY(
                    point,
                    angleY
                );


            p =
                rotateX(
                    p,
                    angleX
                );


            p =
                moveToWorld(p);


            p =
                worldToCamera(
                    p,
                    cameraZ
                );


            return p;
        });



    // ---------------------------------------------
    // PROJECT
    // ---------------------------------------------

    const screenVertices =

        transformedVertices.map(
            point =>
                project(
                    point,
                    focalLength
                )
        );



    // ---------------------------------------------
    // DRAW EDGES
    // ---------------------------------------------

    ctx.strokeStyle =
        "#222";

    ctx.lineWidth =
        2;


    for (const [aIndex, bIndex] of edges) {

        const a =
            screenVertices[aIndex];

        const b =
            screenVertices[bIndex];


        if (!a || !b) {
            continue;
        }


        ctx.beginPath();

        ctx.moveTo(
            a[0],
            a[1]
        );

        ctx.lineTo(
            b[0],
            b[1]
        );

        ctx.stroke();
    }



    // ---------------------------------------------
    // DRAW POINTS
    // ---------------------------------------------

    screenVertices.forEach(
        (point, index) => {

            if (!point) {
                return;
            }


            ctx.beginPath();

            ctx.arc(
                point[0],
                point[1],
                3,
                0,
                Math.PI * 2
            );

            ctx.fillStyle =
                "red";

            ctx.fill();


            ctx.fillStyle =
                "blue";

            ctx.font =
                "11px Arial";

            ctx.fillText(
                index,
                point[0] + 5,
                point[1] - 5
            );
        }
    );
}



// =====================================================
// EVENTS
// =====================================================

rotationYSlider.addEventListener(
    "input",
    draw
);

rotationXSlider.addEventListener(
    "input",
    draw
);

cameraZSlider.addEventListener(
    "input",
    draw
);

focalSlider.addEventListener(
    "input",
    draw
);


draw();

</script>

</body>
</html>
