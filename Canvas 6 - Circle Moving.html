
<!DOCTYPE html>
<html>
<head>
    <title>Circle Moving Along a Line</title>
</head>
<body>

<canvas id="canvas" width="600" height="400"></canvas>

<script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    const A = [80, 300];
    const B = [520, 300];

    let t = 0;
    let direction = 1;

    function clearCanvas() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
    }

    function drawLine(x1, y1, x2, y2) {
        ctx.beginPath();
        ctx.moveTo(x1, y1);
        ctx.lineTo(x2, y2);
        ctx.stroke();
    }

    function drawCircle(x, y, radius) {
        ctx.beginPath();
        ctx.arc(x, y, radius, 0, Math.PI * 2);
        ctx.stroke();
    }

    function action() {
        clearCanvas();

        // Draw the line
        drawLine(A[0], A[1], B[0], B[1]);

        // Calculate circle position
        const x = A[0] + (B[0] - A[0]) * t;
        const y = A[1] + (B[1] - A[1]) * t;

        // Draw the moving circle
        drawCircle(x, y, 20);

        // Move along the line
        t += 0.01 * direction;

        // Reverse at the endpoints
        if (t >= 1) {
            t = 1;
            direction = -1;
        }

        if (t <= 0) {
            t = 0;
            direction = 1;
        }
    }

    setInterval(action, 20);
    action();

</script>
</body>
</html>
